<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Become a Donor - Smart Blood Donor</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Smart Blood Donor</h1>

        <nav>
            <a href="index.html">Home</a>
            <a href="find-blood.html">Find Blood</a>
            <a href="become-donor.html">Become a Donor</a>
        </nav>
    </header>


    <main>

        <section class="donor-registration">

            <h2>Become a Blood Donor</h2>

            <p>
                Register yourself and help save lives.
            </p>

            <form id="donor-form">
                <label for="donor-name">Full Name</label>

                <input type="text"
                       id="donor-name"
                       placeholder="Enter your full name">


                <label for="donor-age">Age</label>

                <input type="number"
                       id="donor-age"
                       min="18"
                       placeholder="Enter your age">


                <label for="donor-blood">Blood Group</label>

                <select id="donor-blood">

                    <option value="">Select Blood Group</option>
                    <option value="A+">A+</option>
                    <option value="A-">A-</option>
                    <option value="B+">B+</option>
                    <option value="B-">B-</option>
                    <option value="AB+">AB+</option>
                    <option value="AB-">AB-</option>
                    <option value="O+">O+</option>
                    <option value="O-">O-</option>

                </select>


                <label for="donor-location">Location</label>

                <input type="text"
                       id="donor-location"
                       placeholder="Enter your city or location">


                <label for="donor-phone">Phone Number</label>

                <input type="tel"
                       id="donor-phone"
                       placeholder="Enter phone number">


                <label for="last-donation">
                    Last Donation Date
                </label>

                <input type="date"
                       id="last-donation">


                <label for="availability">
                    Availability
                </label>

                <select id="availability">

                    <option value="">
                        Select availability
                    </option>

                    <option value="Available">
                        Available
                    </option>

                    <option value="Not Available">
                        Not Available
                    </option>

                </select>


                <button type="submit">
                    Register as Donor
                </button>

            </form>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
