<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Request Summary - Smart Blood Donor Platform</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>Blood Request Summary</h1>

        <div class="donor-card">

            <p>
                <strong>Patient Name:</strong>
                <span id="summary-patient"></span>
            </p>

            <p>
                <strong>Blood Group:</strong>
                <span id="summary-blood"></span>
            </p>

            <p>
                <strong>Location:</strong>
                <span id="summary-location"></span>
            </p>

            <p>
                <strong>Hospital:</strong>
                <span id="summary-hospital"></span>
            </p>

            <p>
                <strong>Units Required:</strong>
                <span id="summary-units"></span>
            </p>

            <p>
                <strong>Urgency:</strong>
                <span id="summary-urgency"></span>
            </p>

        </div>

        <div id="summary-message"></div>

        <button onclick="window.location.href='find-blood.html'">
            Create New Request
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
